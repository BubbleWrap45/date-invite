<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You ❤️</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffe4ec, #fff7fa);
      overflow: hidden;
    }

    .card {
      width: 85%;
      max-width: 500px;
      background: white;
      padding: 40px 25px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.12);
    }

    h1 {
      font-size: 2rem;
    }

    p {
      font-size: 1.2rem;
      color: #555;
    }

    button {
      border: none;
      padding: 15px 25px;
      border-radius: 30px;
      font-size: 18px;
      cursor: pointer;
    }

    #yesButton {
      background: #ff4f81;
      color: white;
      margin: 15px;
    }

    #noButton {
      background: #eee;
      position: fixed;
    }

    #success {
      display: none;
    }

    .heart {
      font-size: 60px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div id="questionScreen">
      <h1>I have a question for you ❤️</h1>

      <p>Will you go on a date with me?</p>

      <button id="yesButton">YES ❤️</button>

      <button id="noButton">NO</button>
    </div>


    <div id="success">
      <div class="heart">❤️</div>

      <h1>Good choice 😌</h1>

      <p>I knew you'd say yes.</p>

      <p>Now let's work out the details...</p>
    </div>

  </div>


  <script>

    const noButton = document.getElementById("noButton");
    const yesButton = document.getElementById("yesButton");

    const questionScreen =
      document.getElementById("questionScreen");

    const success =
      document.getElementById("success");


    let attempts = 0;


    const messages = [
      "Are you sure? 🤨",
      "Really? 😭",
      "Think again 😏",
      "Nice try 😂"
    ];


    function moveNo() {

      if (attempts >= 4) {
        noButton.style.display = "none";
        return;
      }

      noButton.innerText = messages[attempts];

      attempts++;


      const maxX =
        window.innerWidth -
        noButton.offsetWidth -
        20;

      const maxY =
        window.innerHeight -
        noButton.offsetHeight -
        20;


      const x =
        Math.floor(Math.random() * maxX);

      const y =
        Math.floor(Math.random() * maxY);


      noButton.style.left = x + "px";
      noButton.style.top = y + "px";
    }


    // Desktop
    noButton.addEventListener("mouseover", moveNo);


    // Phone
    noButton.addEventListener("touchstart", function(event) {
      event.preventDefault();
      moveNo();
    });


    // YES
    yesButton.addEventListener("click", function() {

      noButton.style.display = "none";

      questionScreen.style.display = "none";

      success.style.display = "block";

    });

  </script>

</body>
</html>
