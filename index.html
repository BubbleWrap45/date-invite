<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For You ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffe4ec, #fff7fa);
      overflow: hidden;
    }

    .card {
      width: min(90%, 500px);
      background: white;
      padding: 40px 25px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
    }

    h1 {
      margin-top: 0;
      font-size: 2rem;
    }

    p {
      font-size: 1.2rem;
      color: #555;
    }

    .buttons {
      position: relative;
      height: 130px;
      margin-top: 30px;
    }

    button {
      border: none;
      padding: 15px 28px;
      border-radius: 999px;
      font-size: 1.05rem;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #yesButton {
      background: #ff4f81;
      color: white;
      margin-right: 15px;
    }

    #yesButton:hover {
      transform: scale(1.08);
    }

    #noButton {
      position: absolute;
      background: #eeeeee;
      color: #333;
    }

    #success {
      display: none;
    }

    .heart {
      font-size: 4rem;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div id="questionScreen">
      <h1>I have a question for you ❤️</h1>

      <p>Will you go on a date with me?</p>

      <div class="buttons">
        <button id="yesButton">YES ❤️</button>
        <button id="noButton">NO</button>
      </div>
    </div>

    <div id="success">
      <div class="heart">❤️</div>
      <h1>Good choice 😌</h1>
      <p>I knew you'd say yes.</p>
      <p>Now let's work out the details...</p>
    </div>

  </div>

  <script>
    const noButton = document.getElementById("noButton");
    const yesButton = document.getElementById("yesButton");
    const questionScreen = document.getElementById("questionScreen");
    const success = document.getElementById("success");

    function moveNoButton() {
      const maxX = window.innerWidth - noButton.offsetWidth - 20;
      const maxY = window.innerHeight - noButton.offsetHeight - 20;

      const randomX = Math.max(10, Math.random() * maxX);
      const randomY = Math.max(10, Math.random() * maxY);

      noButton.style.position = "fixed";
      noButton.style.left = randomX + "px";
      noButton.style.top = randomY + "px";
    }

    noButton.addEventListener("mouseenter", moveNoButton);

    noButton.addEventListener("touchstart", function(event) {
      event.preventDefault();
      moveNoButton();
    });

    yesButton.addEventListener("click", function() {
      questionScreen.style.display = "none";
      success.style.display = "block";
    });
  </script>

</body>
</html>
