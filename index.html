<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffe4ec, #fff7fa);
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: white;
      padding: 35px 25px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.12);
    }

    h1 {
      margin-top: 0;
    }

    p {
      color: #555;
      font-size: 1.1rem;
    }

    .step {
      display: none;
    }

    .step.active {
      display: block;
    }

    button {
      border: none;
      padding: 15px 25px;
      border-radius: 30px;
      font-size: 17px;
      cursor: pointer;
    }

    .primary {
      background: #ff4f81;
      color: white;
      width: 100%;
      margin-top: 15px;
    }

    #yesButton {
      background: #ff4f81;
      color: white;
      margin: 15px;
    }

    #noButton {
      background: #eee;
      position: fixed;
    }

    .heart {
      font-size: 55px;
    }

    .form-group {
      text-align: left;
      margin: 18px 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      font-family: inherit;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .confirmation {
      margin-top: 25px;
      padding: 22px;
      border: 2px solid #ffd0dd;
      border-radius: 20px;
      background: #fff8fa;
      text-align: left;
    }

    .confirmation h2 {
      text-align: center;
      margin-top: 0;
    }

    .confirmation p {
      margin: 12px 0;
    }

    .small {
      font-size: 0.9rem;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- QUESTION -->
    <div id="questionScreen" class="step active">
      <h1>I have a question for you ❤️</h1>
      <p>Will you go on a date with me?</p>

      <button id="yesButton">YES ❤️</button>
      <button id="noButton">NO</button>
    </div>

    <!-- DATE + TIME -->
    <div id="dateStep" class="step">
      <div class="heart">❤️</div>
      <h1>Good choice 😌</h1>
      <p>First, when should we go?</p>

      <div class="form-group">
        <label for="date">📅 Date</label>
        <input type="date" id="date">
      </div>

      <div class="form-group">
        <label for="time">⏰ Time</label>
        <input type="time" id="time">
      </div>

      <button class="primary" id="dateNext">
        Next →
      </button>
    </div>

    <!-- LOCATION -->
    <div id="locationStep" class="step">
      <h1>Where should we go? 📍</h1>

      <div class="form-group">
        <label for="location">Location</label>
        <input
          type="text"
          id="location"
          placeholder="Restaurant, beach, your place..."
        >
      </div>

      <button class="primary" id="locationNext">
        Next →
      </button>
    </div>

    <!-- ACTIVITY -->
    <div id="activityStep" class="step">
      <h1>What should we do? ✨</h1>

      <div class="form-group">
        <label for="activity">Plan</label>
        <input
          type="text"
          id="activity"
          placeholder="Dinner, drinks, movie, surprise me..."
        >
      </div>

      <button class="primary" id="activityNext">
        Next →
      </button>
    </div>

    <!-- MESSAGE -->
    <div id="messageStep" class="step">
      <h1>Anything else? 💌</h1>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea
          id="message"
          placeholder="Leave me a message..."
        ></textarea>
      </div>

      <button class="primary" id="confirmButton">
        Confirm our date ❤️
      </button>
    </div>

    <!-- FINAL -->
    <div id="finalScreen" class="step">
      <div class="heart">❤️</div>

      <h1>It's a date!</h1>

      <div class="confirmation">
        <h2>Our Date ❤️</h2>

        <p>
          <strong>📅 Date:</strong>
          <span id="finalDate"></span>
        </p>

        <p>
          <strong>⏰ Time:</strong>
          <span id="finalTime"></span>
        </p>

        <p>
          <strong>📍 Location:</strong>
          <span id="finalLocation"></span>
        </p>

        <p>
          <strong>✨ Plan:</strong>
          <span id="finalActivity"></span>
        </p>

        <p>
          <strong>💌 Message:</strong>
          <span id="finalMessage"></span>
        </p>
      </div>

      <p class="small">
        📸 Screenshot this and send it to me
      </p>
    </div>

  </div>

  <script>
    const noButton = document.getElementById("noButton");
    const yesButton = document.getElementById("yesButton");

    const questionScreen = document.getElementById("questionScreen");
    const dateStep = document.getElementById("dateStep");
    const locationStep = document.getElementById("locationStep");
    const activityStep = document.getElementById("activityStep");
    const messageStep = document.getElementById("messageStep");
    const finalScreen = document.getElementById("finalScreen");

    const dateNext = document.getElementById("dateNext");
    const locationNext = document.getElementById("locationNext");
    const activityNext = document.getElementById("activityNext");
    const confirmButton = document.getElementById("confirmButton");

    let attempts = 0;

    const messages = [
      "Are you sure? 🤨",
      "Really? 😭",
      "Think again 😏",
      "Nice try 😂"
    ];

    function showStep(step) {
      const steps = document.querySelectorAll(".step");

      steps.forEach(function(item) {
        item.classList.remove("active");
      });

      step.classList.add("active");
    }

    function moveNo() {
      if (attempts >= 4) {
        noButton.style.display = "none";
        return;
      }

      noButton.innerText = messages[attempts];
      attempts++;

      const maxX = window.innerWidth - noButton.offsetWidth - 20;
      const maxY = window.innerHeight - noButton.offsetHeight - 20;

      const x = Math.floor(Math.random() * maxX);
      const y = Math.floor(Math.random() * maxY);

      noButton.style.left = x + "px";
      noButton.style.top = y + "px";
    }

    noButton.addEventListener("mouseover", moveNo);

    noButton.addEventListener("touchstart", function(event) {
      event.preventDefault();
      moveNo();
    });

    yesButton.addEventListener("click", function() {
      noButton.style.display = "none";
      showStep(dateStep);
    });

    dateNext.addEventListener("click", function() {
      const date = document.getElementById("date").value;
      const time = document.getElementById("time").value;

      if (!date || !time) {
        alert("Please choose a date and time ❤️");
        return;
      }

      showStep(locationStep);
    });

    locationNext.addEventListener("click", function() {
      const location = document.getElementById("location").value.trim();

      if (!location) {
        alert("Please choose where we should go 📍");
        return;
      }

      showStep(activityStep);
    });

    activityNext.addEventListener("click", function() {
      const activity = document.getElementById("activity").value.trim();

      if (!activity) {
        alert("Tell me what we should do ✨");
        return;
      }

      showStep(messageStep);
    });

    confirmButton.addEventListener("click", function() {
      const date = document.getElementById("date").value;
      const time = document.getElementById("time").value;
      const location = document.getElementById("location").value;
      const activity = document.getElementById("activity").value;
      const message = document.getElementById("message").value;

      document.getElementById("finalDate").innerText = date;
      document.getElementById("finalTime").innerText = time;
      document.getElementById("finalLocation").innerText = location;
      document.getElementById("finalActivity").innerText = activity;
      document.getElementById("finalMessage").innerText =
        message || "No message";

      showStep(finalScreen);
    });
  </script>

</body>
</html>
